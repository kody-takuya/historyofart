server {
  listen ${PORT};
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css text/javascript application/xml text/plain;
  error_page 404 /404.html;
  location /assets/ { add_header Cache-Control "public, max-age=3600"; }
  location / { try_files $uri $uri/index.html =404; add_header Cache-Control "public, max-age=300"; }
}
